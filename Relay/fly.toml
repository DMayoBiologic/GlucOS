# Fly.io config for the GlucOS push relay. Deployed automatically on merge to main when the
# FLY_API_TOKEN secret is set (see docs/iOS.md). Change `app` if the name is taken.
# The app name is passed with -a by the workflow (FLY_APP_NAME, default glucos-relay-<owner>).
app = "glucos-relay"
primary_region = "syd"

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "glucos_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the relay is what fetches and pushes while the phone is asleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
