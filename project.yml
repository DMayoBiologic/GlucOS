name: GlucOS

options:
  bundleIdPrefix: au.com.declanmayo
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Local-build default only. Release builds get their version from the next git tag (release.yml).
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing by default so local builds and CI builds are interchangeable for Sparkle.
    # CI overrides these when a Developer ID certificate is configured (see .github/workflows/release.yml).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SPARKLE_FEED_URL: https://github.com/DMayoBiologic/GlucOS/releases/latest/download/appcast.xml
    # Public EdDSA key for Sparkle update signatures. `make sparkle-keys` fills this in.
    SPARKLE_PUBLIC_ED_KEY: "9fjmJfnCALm3vAZqtJNPRkCqYDs51XPtKzy77eCukKk="
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

targets:
  GlucOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Engine
      - path: Sources/Shared
    dependencies:
      - target: GlucOSWidget
        embed: true
        codeSign: true
      - package: Sparkle
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.medical
        NSHumanReadableCopyright: "Personal use. Not a medical device."
        # Sparkle
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600 # hourly, Sparkle's minimum
        SUAllowsAutomaticUpdates: true
        # glucos://open, used by the widget (and anything else) to bring up the popover.
        CFBundleURLTypes:
          - CFBundleURLName: au.com.declanmayo.glucos
            CFBundleURLSchemes: [glucos]
    entitlements:
      path: Sources/App/GlucOS.entitlements
      properties:
        # Not sandboxed: keeps Sparkle's installer simple. Hardened runtime stays on.
        # Ad-hoc builds have no Team ID, so library validation would refuse to load the
        # embedded Sparkle.framework ("different Team IDs") and the app dies at launch.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos
        PRODUCT_NAME: GlucOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  GlucOSWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOSWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/GlucOSWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App Groups need a provisioning profile on macOS, which ad-hoc builds don't have.
        # Instead the app writes to ~/Library/Application Support/GlucOS and the widget
        # gets read-only access to that one folder.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/GlucOS/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos.widget
        PRODUCT_NAME: GlucOSWidget
        SKIP_INSTALL: YES

  # MARK: iPhone
  #
  # Shares Sources/Shared, Core, Engine and the Mac app's model, client and store files. Built and
  # signed by .github/workflows/release.yml (TestFlight) when the Apple secrets are set; CI builds
  # it unsigned. The GlucOS scheme above never builds these, so the Mac release is unaffected.

  GlucOSiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: Sources/iOS
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Core
      - path: Sources/Engine
      - path: Sources/Shared
      - path: Sources/App/AlertManager.swift
      - path: Sources/App/AppSettings.swift
      - path: Sources/App/Keychain.swift
      - path: Sources/App/LibreLinkUpClient.swift
      - path: Sources/App/GlucoseStore.swift
      - path: Sources/App/HistoryArchive.swift
      - path: Sources/App/Logbook/LogbookModels.swift
      - path: Sources/App/Logbook/LogbookStore.swift
      - path: Sources/App/Logbook/LogbookSync.swift
      - path: Sources/App/Logbook/LogbookSyncClient.swift
      - path: Sources/App/Logbook/LogbookSyncService.swift
      - path: Sources/App/Outlook/OutlookStore.swift
      - path: Sources/App/Views/FlowComponents.swift
      - path: Sources/App/Views/MenuBar/PopoverInsights.swift
    dependencies:
      - target: GlucOSiOSWidget
        embed: true
        codeSign: true
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Lock Screen card, updated by the push relay about once a minute.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [au.com.declanmayo.glucos.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: au.com.declanmayo.glucos
            CFBundleURLSchemes: [glucos]
        # Baked in by the release workflow from the RELAY_URL variable and RELAY_SECRET secret,
        # so the TestFlight build is connected to the relay with nothing to type.
        GlucOSRelayURL: $(GLUCOS_RELAY_URL)
        GlucOSRelaySecret: $(GLUCOS_RELAY_SECRET)
    entitlements:
      path: Sources/iOS/GlucOS.entitlements
      properties:
        # Xcode switches this to production when it exports for TestFlight.
        aps-environment: development
        com.apple.security.application-groups: [group.au.com.declanmayo.glucos]
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos.ios
        PRODUCT_NAME: GlucOS
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        GLUCOS_RELAY_URL: ""
        GLUCOS_RELAY_SECRET: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  GlucOSiOSWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: Sources/iOSWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Widget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Shared
    info:
      path: Sources/iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOSWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/iOSWidget/GlucOSWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.au.com.declanmayo.glucos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos.ios.widget
        PRODUCT_NAME: GlucOSWidget
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  GlucOSiOS:
    build:
      targets:
        GlucOSiOS: all
    run:
      config: Debug
    archive:
      config: Release
  GlucOS:
    build:
      targets:
        GlucOS: all
    run:
      config: Debug
    archive:
      config: Release
