name: GlucOS

options:
  bundleIdPrefix: au.com.declanmayo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing by default so local builds and CI builds are interchangeable for Sparkle.
    # CI overrides these when a Developer ID certificate is configured (see .github/workflows/release.yml).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SPARKLE_FEED_URL: https://github.com/DMayoBiologic/GlucOS/releases/latest/download/appcast.xml
    # Public EdDSA key for Sparkle update signatures. `make sparkle-keys` fills this in.
    SPARKLE_PUBLIC_ED_KEY: "9fjmJfnCALm3vAZqtJNPRkCqYDs51XPtKzy77eCukKk="
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

targets:
  GlucOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: GlucOSWidget
        embed: true
        codeSign: true
      - package: Sparkle
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.medical
        NSHumanReadableCopyright: "Personal use. Not a medical device."
        # Sparkle
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
        SUAllowsAutomaticUpdates: true
    entitlements:
      path: Sources/App/GlucOS.entitlements
      properties:
        # Not sandboxed: keeps Sparkle's installer simple. Hardened runtime stays on.
        # Ad-hoc builds have no Team ID, so library validation would refuse to load the
        # embedded Sparkle.framework ("different Team IDs") and the app dies at launch.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos
        PRODUCT_NAME: GlucOS
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  GlucOSWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: GlucOS
        CFBundleName: GlucOSWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/GlucOSWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App Groups need a provisioning profile on macOS, which ad-hoc builds don't have.
        # Instead the app writes to ~/Library/Application Support/GlucOS and the widget
        # gets read-only access to that one folder.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/GlucOS/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos.widget
        PRODUCT_NAME: GlucOSWidget
        SKIP_INSTALL: YES

  GlucOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Shared logic is compiled straight in, so the tests need no host app.
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.declanmayo.glucos.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  GlucOS:
    build:
      targets:
        GlucOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlucOSTests
    archive:
      config: Release
