name: TestFlight public link

# Apple only lets the external group's public link turn on once a build has passed Beta App
# Review, which happens hours after the release that submitted it. This checks every hour
# and switches it on, then prints the link in the run summary. Once it's on, each run is a quick
# no-op. See docs/TestFlight.md.

on:
  schedule:
    # GitHub drops many scheduled runs (this went 18 hours without one), so ask hourly.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    env:
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      # So a change to the reviewer contact details reaches Apple without waiting for a release.
      CONTACT_FIRST_NAME: ${{ vars.TESTFLIGHT_CONTACT_FIRST_NAME }}
      CONTACT_LAST_NAME: ${{ vars.TESTFLIGHT_CONTACT_LAST_NAME }}
      CONTACT_EMAIL: ${{ vars.TESTFLIGHT_CONTACT_EMAIL }}
      CONTACT_PHONE: ${{ vars.TESTFLIGHT_CONTACT_PHONE }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEY_P8 != ''
        with:
          persist-credentials: false
      - name: Turn on the public link
        if: env.KEY_P8 != ''
        run: |
          pip install --quiet 'pyjwt[crypto]==2.10.1'
          python3 scripts/testflight_external.py --link-only
