name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build (Debug, ad-hoc)
        run: |
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOS -configuration Debug \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "::error::Build failed"; grep -E "error:" build.log | sort -u; exit 1; }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
