name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Engine unit tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build (Debug, ad-hoc)
        run: |
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOS -configuration Debug \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "::error::Build failed"; grep -E "error:" build.log | sort -u; exit 1; }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  # The iPhone app and its widget extension (Live Activity, Lock Screen and Home Screen
  # widgets), unsigned. Signing and TestFlight happen in release.yml.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        # App Store Connect only accepts iOS builds made with the iOS 26 SDK or later.
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build (Debug, simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOSiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-ios.log || { echo "::error::iOS build failed"; grep -E "error:" build-ios.log | sort -u; exit 1; }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log
          path: build-ios.log

  # The Supabase side: the push relay and logbook sync tests, including the parity check against the
  # Swift alert rules and forecast, and a run against Supabase's own Postgres image with the
  # migrations applied (twice, since the Supabase GitHub integration may re-run them).
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.1.4
      - name: Start Supabase Postgres
        run: |
          docker run -d --name db -p 54329:5432 -e POSTGRES_PASSWORD=postgres supabase/postgres:15.8.1.060 \
            -c config_file=/etc/postgresql/postgresql.conf -c cron.database_name=postgres
          for i in $(seq 90); do
            docker logs db 2>&1 | grep -q "PostgreSQL init process complete" \
              && docker exec db pg_isready -U postgres -h 127.0.0.1 >/dev/null && break
            sleep 2
          done
          docker exec db pg_isready -U postgres -h 127.0.0.1
      - name: Apply migrations
        run: |
          for pass in 1 2; do
            for f in supabase/migrations/*.sql; do
              docker exec -i db psql -v ON_ERROR_STOP=1 -q -U postgres -h 127.0.0.1 < "$f"
            done
          done
      - name: Type-check
        run: deno check supabase/functions/relay/index.ts supabase/functions/account/index.ts supabase/functions/share/index.ts
      - name: Edge function tests
        env:
          GLUCOS_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
        run: deno test --allow-read --allow-env --allow-net supabase/functions/
