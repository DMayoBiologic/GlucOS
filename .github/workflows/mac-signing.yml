name: Mac signing

# Runs the release's Developer ID signing and notarization on a pull request that touches them,
# so a broken signing setup is caught before it reaches main (where it would stop releases).
# Nothing is published. Skips itself on forks, which don't get the Apple secrets.

on:
  pull_request:
    paths:
      - scripts/sign_mac.sh
      - .github/workflows/release.yml
      - .github/workflows/mac-signing.yml
      - project.yml
      - Sources/App/Keychain.swift
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$TEAM_ID" ] || [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::notice::No Developer ID secrets here (a fork, or MACOS_CERTIFICATE_P12 not set yet), so signing isn't checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Build and sign
        if: steps.check.outputs.ready == 'true'
        env:
          VERSION: 0.0.1
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          SPARKLE_PUBLIC_ED_KEY=$(grep -E '^\s*SPARKLE_PUBLIC_ED_KEY:' project.yml | sed -E 's/.*"([^"]*)".*/\1/') \
            OUT=build/export scripts/sign_mac.sh
      - name: Notarize
        if: steps.check.outputs.ready == 'true'
        run: |
          APP=build/export/GlucOS.app
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --output-format json \
            | tee "$RUNNER_TEMP/notary.json"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          grep -qE '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json" || { echo "::error::Notarization wasn't accepted"; exit 1; }
          xcrun stapler staple "$APP"
          spctl --assess --type execute -vv "$APP"
