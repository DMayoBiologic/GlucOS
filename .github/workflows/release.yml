name: Release

# Every push to main ships: next version → build → sign → zip → Sparkle appcast → GitHub Release.
# Installed copies of GlucOS pick the update up from releases/latest/download/appcast.xml.
#
# Versioning is automatic, from the latest vX.Y.Z tag:
#   patch bump by default; put [minor] or [major] in the PR title / merge commit message to bump more.
#   [skip release] in the PR title / commit subject skips the release. Docs-only pushes (*.md) are skipped.
# Manual run (Actions → Release → Run workflow) can force a specific version, or leave it blank to auto-bump.
#
# Required secret:   SPARKLE_PRIVATE_KEY   (from `make sparkle-keys`)
# Mac signing:       MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD (Developer ID Application, base64
#                    .p12; `make mac-signing-secret` sets them) + APPLE_TEAM_ID and the App Store Connect
#                    key secrets below → Developer ID signed and notarized. Without them the app is ad-hoc signed (and macOS asks
#                    for the Keychain password after each update); Sparkle verifies updates with EdDSA either way.
#
# The same push also ships the iPhone app (see docs/iOS.md), as a separate job after the Mac
# release so it can never hold it up or break it. It skips itself with a notice until its
# secrets exist:
#   iPhone → TestFlight:  APPLE_TEAM_ID + the App Store Connect API key secrets above
#                         (the key needs the Admin role so Xcode can manage signing)
#   Optional variable:    RELAY_URL (default the Supabase project's relay function), baked into
#                         the build. The relay's secret never is: the owner's phone claims it.
#   iPhone → external testers (public TestFlight link): the same API key. Optional variables
#                         TESTFLIGHT_CONTACT_FIRST_NAME/LAST_NAME/EMAIL/PHONE fill in Beta App
#                         Review's contact details if App Store Connect doesn't have them yet.
# The push relay itself is in supabase/ and deploys from main through the Supabase GitHub
# integration (migrations and edge functions), not from this workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Leave blank to auto-bump the patch version."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only the subject line can skip a release (for a squash merge that's the PR title; for a merge
  # commit, the PR title line under "Merge pull request …"). Scanning the whole message would let
  # a squash body that merely mentions the marker skip a release by accident.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - id: s
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE=$(printf '%s\n' "$MSG" | head -1)
          case "$TITLE" in
            "Merge pull request "*) TITLE="$TITLE $(printf '%s\n' "$MSG" | sed -n '3p')" ;;
          esac
          case "$TITLE" in
            *"[skip release]"*) echo "skip=true"  >> "$GITHUB_OUTPUT"; echo "Skipping: $TITLE" ;;
            *)                  echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    needs: gate
    # Releases only ever come from main, even when run by hand from another branch.
    if: needs.gate.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --force --quiet
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+$'
          # Re-run of a commit that already shipped: rebuild the same version instead of bumping.
          EXISTING=$(git tag --points-at HEAD -l 'v*' | sed 's/^v//' | grep -E "$SEMVER" | sort -V | tail -1 || true)
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | grep -E "$SEMVER" | sort -V | tail -1 || true)
          LATEST=${LATEST:-0.0.0}
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          elif [ -n "$EXISTING" ]; then
            V="$EXISTING"
          else
            IFS=. read -r MA MI PA <<< "$LATEST"
            # Look at every commit since the last release, not just HEAD, so a [minor]/[major]
            # marker isn't lost when a queued run is superseded or a PR is rebase-merged.
            MSGS="$COMMIT_MSG"
            if git rev-parse -q --verify "refs/tags/v$LATEST" >/dev/null; then
              MSGS="$MSGS $(git log --format=%B "v$LATEST..HEAD")"
            fi
            case "$MSGS" in
              *"[major]"*) V="$((MA + 1)).0.0" ;;
              *"[minor]"*) V="$MA.$((MI + 1)).0" ;;
              *)          V="$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          echo "$V" | grep -qE "$SEMVER" || { echo "::error::Bad version '$V' (want X.Y.Z)"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            [ "$(git rev-parse "v$V^{commit}")" = "$(git rev-parse HEAD)" ] || {
              echo "::error::Tag v$V already exists on another commit; pick a new version"; exit 1; }
          elif [ "$V" != "$LATEST" ] && [ "$(printf '%s\n%s\n' "$V" "$LATEST" | sort -V | tail -1)" != "$V" ]; then
            # A new release is always marked latest (that's what installed copies update to),
            # so it must be newer than everything already shipped.
            echo "::error::$V is older than the latest release v$LATEST"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Latest tag v$LATEST → releasing $V"

      - name: Sparkle public key
        id: key
        run: |
          KEY="${{ vars.SPARKLE_PUBLIC_ED_KEY }}"
          if [ -z "$KEY" ]; then
            KEY=$(grep -E '^\s*SPARKLE_PUBLIC_ED_KEY:' project.yml | sed -E 's/.*"([^"]*)".*/\1/')
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No Sparkle public key. Run 'make sparkle-keys' locally (sets the repo secret and commits the public key)."
            exit 1
          fi
          if [ -z "${{ secrets.SPARKLE_PRIVATE_KEY }}" ]; then
            echo "::error::Repo secret SPARKLE_PRIVATE_KEY is missing. Run 'make sparkle-keys'."
            exit 1
          fi
          echo "public=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      # Developer ID signing (MACOS_CERTIFICATE_P12) plus the iPhone release's App Store Connect key
      # for the provisioning profile. A stable signature is what stops macOS asking for the
      # Keychain password after every update (scripts/sign_mac.sh).
      # Without the Apple secrets (a fork, say) the app is ad-hoc signed as before.
      - name: Build and sign
        id: sign
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_ED_KEY: ${{ steps.key.outputs.public }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$TEAM_ID" ] && [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            # Once releases are Developer ID signed, an ad-hoc one would lose access to the saved
            # logins, so a signing failure fails the release instead of quietly falling back.
            OUT=build/export scripts/sign_mac.sh
            echo "app=build/export/GlucOS.app" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::No Developer ID secrets: ad-hoc signing, so macOS will ask for the Keychain password after this update."
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOS -configuration Release \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build 2>&1 | grep -E "error:|warning: .*deprecated|BUILD|Signing" || true
          test -d build/Build/Products/Release/GlucOS.app || { echo "::error::Build failed"; exit 1; }
          codesign --verify --deep --strict build/Build/Products/Release/GlucOS.app
          echo "app=build/Build/Products/Release/GlucOS.app" >> "$GITHUB_OUTPUT"
          echo "signed=false" >> "$GITHUB_OUTPUT"

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="${{ steps.sign.outputs.app }}"
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$APP"
          spctl --assess --type execute -vv "$APP"

      - name: Package
        id: pkg
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent "${{ steps.sign.outputs.app }}" "dist/GlucOS-$V.zip"
          ls -la dist

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          BIN=$(find build/SourcePackages/artifacts -type d -path '*Sparkle/bin' | head -1)
          test -n "$BIN" || { echo "::error::Sparkle tools not found"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          "$BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/ed_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$V/" \
            --link "https://github.com/${{ github.repository }}/releases" \
            -o dist/appcast.xml dist/
          rm -f "$RUNNER_TEMP/ed_key"
          cat dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/GlucOS-$V.zip" dist/appcast.xml --clobber
          else
            gh release create "v$V" "dist/GlucOS-$V.zip" dist/appcast.xml \
              --target "$GITHUB_SHA" --title "GlucOS $V" --generate-notes --latest
          fi
          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$V"

  # iPhone app → App Store Connect → TestFlight, with the same version number as the Mac release.
  ios:
    needs: release
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::notice::iPhone app not uploaded: set APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_P8 (see docs/iOS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Use Xcode 26
        if: steps.check.outputs.ready == 'true'
        # App Store Connect only accepts iOS builds made with the iOS 26 SDK or later.
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version

      - name: Archive
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # Only the relay's address goes in the build, never its secret: anyone with the public
          # TestFlight link can install this. The owner's phone claims the secret from the relay.
          URL="${RELAY_URL:-https://aqlbadbyjuoruwnwyfrc.supabase.co/functions/v1/relay}"
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOSiOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GlucOS.xcarchive" \
            -derivedDataPath build-ios -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ needs.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GLUCOS_RELAY_URL="$URL" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE|Signing" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            echo "::error::iOS archive failed"
            grep -E "error:" archive.log | sort -u
            # Apple's API can register an App ID but can't assign it an App Group.
            if grep -q "application-groups entitlement" archive.log; then
              echo "::error::An App ID is missing its App Group. Tick App Groups on it in the developer portal (docs/iOS.md, step 2)."
            fi
            exit 1
          fi

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GlucOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "Uploaded GlucOS ${{ needs.release.outputs.version }} (${{ github.run_number }}) to App Store Connect; TestFlight has it once Apple finishes processing."

  # The same build to external testers: anyone with the public TestFlight link. Sets up the
  # "Public" group and its link, the test information and the build's notes, then submits the
  # build for Beta App Review. Apple approves it (usually within a day for the first build of a
  # version, often minutes after that) and TestFlight offers it to the group. On Ubuntu, because
  # most of the time is waiting for App Store Connect to finish processing the upload.
  testflight-external:
    needs: [release, ios]
    runs-on: ubuntu-latest
    env:
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      APP_VERSION: ${{ needs.release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      CONTACT_FIRST_NAME: ${{ vars.TESTFLIGHT_CONTACT_FIRST_NAME }}
      CONTACT_LAST_NAME: ${{ vars.TESTFLIGHT_CONTACT_LAST_NAME }}
      CONTACT_EMAIL: ${{ vars.TESTFLIGHT_CONTACT_EMAIL }}
      CONTACT_PHONE: ${{ vars.TESTFLIGHT_CONTACT_PHONE }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEY_P8 != ''
        with:
          persist-credentials: false
          fetch-depth: 50
          fetch-tags: true
      - name: Release notes for testers
        if: env.KEY_P8 != ''
        # The PR titles merged since the last release, without bump markers.
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          git log --format='- %s' "$RANGE" 2>/dev/null | head -12 \
            | sed -E 's/ ?\[(minor|major|skip release)\]//g; s/ \(#[0-9]+\)$//' > "$RUNNER_TEMP/whats_new.txt" || true
          [ -s "$RUNNER_TEMP/whats_new.txt" ] || git log -1 --format='- %s' > "$RUNNER_TEMP/whats_new.txt"
          cat "$RUNNER_TEMP/whats_new.txt"
      - name: Ship to external testers
        if: env.KEY_P8 != ''
        run: |
          pip install --quiet 'pyjwt[crypto]==2.10.1'
          WHATS_NEW_FILE="$RUNNER_TEMP/whats_new.txt" python3 scripts/testflight_external.py
