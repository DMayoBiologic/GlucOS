name: Release

# Every push to main ships: next version → build → sign → zip → Sparkle appcast → GitHub Release.
# Installed copies of GlucOS pick the update up from releases/latest/download/appcast.xml.
#
# Versioning is automatic, from the latest vX.Y.Z tag:
#   patch bump by default; put [minor] or [major] in the PR title / merge commit message to bump more.
#   [skip release] in the PR title / commit subject skips the release. Docs-only pushes (*.md) are skipped.
# Manual run (Actions → Release → Run workflow) can force a specific version, or leave it blank to auto-bump.
#
# Required secret:   SPARKLE_PRIVATE_KEY   (from `make sparkle-keys`)
# Optional secrets:  MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD   (Developer ID Application, base64 .p12)
#                    APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8   (App Store Connect API key → notarization)
# Without the optional ones the app is ad-hoc signed; Sparkle still verifies updates with EdDSA.
#
# The same push also ships the iPhone app and the push relay (see docs/iOS.md). Both are separate
# jobs after the Mac release, so they can never hold it up or break it, and each skips itself
# with a notice until its secrets exist:
#   iPhone → TestFlight:  APPLE_TEAM_ID + the App Store Connect API key secrets above
#                         (the key needs the Admin role so Xcode can manage signing)
#   Relay → Fly.io:       FLY_API_TOKEN, RELAY_SECRET, APNS_KEY_P8, APNS_KEY_ID, APPLE_TEAM_ID
#   Optional variables:   FLY_APP_NAME (default glucos-relay-<owner>), RELAY_URL (default its fly.dev address)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Leave blank to auto-bump the patch version."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only the subject line can skip a release (for a squash merge that's the PR title; for a merge
  # commit, the PR title line under "Merge pull request …"). Scanning the whole message would let
  # a squash body that merely mentions the marker skip a release by accident.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - id: s
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE=$(printf '%s\n' "$MSG" | head -1)
          case "$TITLE" in
            "Merge pull request "*) TITLE="$TITLE $(printf '%s\n' "$MSG" | sed -n '3p')" ;;
          esac
          case "$TITLE" in
            *"[skip release]"*) echo "skip=true"  >> "$GITHUB_OUTPUT"; echo "Skipping: $TITLE" ;;
            *)                  echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    needs: gate
    # Releases only ever come from main, even when run by hand from another branch.
    if: needs.gate.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --force --quiet
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+$'
          # Re-run of a commit that already shipped: rebuild the same version instead of bumping.
          EXISTING=$(git tag --points-at HEAD -l 'v*' | sed 's/^v//' | grep -E "$SEMVER" | sort -V | tail -1 || true)
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | grep -E "$SEMVER" | sort -V | tail -1 || true)
          LATEST=${LATEST:-0.0.0}
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          elif [ -n "$EXISTING" ]; then
            V="$EXISTING"
          else
            IFS=. read -r MA MI PA <<< "$LATEST"
            # Look at every commit since the last release, not just HEAD, so a [minor]/[major]
            # marker isn't lost when a queued run is superseded or a PR is rebase-merged.
            MSGS="$COMMIT_MSG"
            if git rev-parse -q --verify "refs/tags/v$LATEST" >/dev/null; then
              MSGS="$MSGS $(git log --format=%B "v$LATEST..HEAD")"
            fi
            case "$MSGS" in
              *"[major]"*) V="$((MA + 1)).0.0" ;;
              *"[minor]"*) V="$MA.$((MI + 1)).0" ;;
              *)          V="$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          echo "$V" | grep -qE "$SEMVER" || { echo "::error::Bad version '$V' (want X.Y.Z)"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            [ "$(git rev-parse "v$V^{commit}")" = "$(git rev-parse HEAD)" ] || {
              echo "::error::Tag v$V already exists on another commit; pick a new version"; exit 1; }
          elif [ "$V" != "$LATEST" ] && [ "$(printf '%s\n%s\n' "$V" "$LATEST" | sort -V | tail -1)" != "$V" ]; then
            # A new release is always marked latest (that's what installed copies update to),
            # so it must be newer than everything already shipped.
            echo "::error::$V is older than the latest release v$LATEST"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Latest tag v$LATEST → releasing $V"

      - name: Sparkle public key
        id: key
        run: |
          KEY="${{ vars.SPARKLE_PUBLIC_ED_KEY }}"
          if [ -z "$KEY" ]; then
            KEY=$(grep -E '^\s*SPARKLE_PUBLIC_ED_KEY:' project.yml | sed -E 's/.*"([^"]*)".*/\1/')
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No Sparkle public key. Run 'make sparkle-keys' locally (sets the repo secret and commits the public key)."
            exit 1
          fi
          if [ -z "${{ secrets.SPARKLE_PRIVATE_KEY }}" ]; then
            echo "::error::Repo secret SPARKLE_PRIVATE_KEY is missing. Run 'make sparkle-keys'."
            exit 1
          fi
          echo "public=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Import Developer ID certificate (optional)
        id: sign
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No certificate secret — ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "team=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p actions "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TEAM=$(echo "$ID" | grep -oE '\([A-Z0-9]{10}\)' | tr -d '()')
          echo "Signing as: $ID"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOS -configuration Release \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="${{ steps.sign.outputs.identity }}" \
            DEVELOPMENT_TEAM="${{ steps.sign.outputs.team }}" \
            SPARKLE_PUBLIC_ED_KEY="${{ steps.key.outputs.public }}" \
            build 2>&1 | grep -E "error:|warning: .*deprecated|BUILD|Signing" || true
          test -d build/Build/Products/Release/GlucOS.app || { echo "::error::Build failed"; exit 1; }
          codesign --verify --deep --strict build/Build/Products/Release/GlucOS.app

      - name: Notarize (optional)
        if: steps.sign.outputs.identity != '-' && env.KEY_P8 != ''
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP=build/Build/Products/Release/GlucOS.app
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "$APP"

      - name: Package
        id: pkg
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent build/Build/Products/Release/GlucOS.app "dist/GlucOS-$V.zip"
          ls -la dist

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          BIN=$(find build/SourcePackages/artifacts -type d -path '*Sparkle/bin' | head -1)
          test -n "$BIN" || { echo "::error::Sparkle tools not found"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          "$BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/ed_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$V/" \
            --link "https://github.com/${{ github.repository }}/releases" \
            -o dist/appcast.xml dist/
          rm -f "$RUNNER_TEMP/ed_key"
          cat dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/GlucOS-$V.zip" dist/appcast.xml --clobber
          else
            gh release create "v$V" "dist/GlucOS-$V.zip" dist/appcast.xml \
              --target "$GITHUB_SHA" --title "GlucOS $V" --generate-notes --latest
          fi
          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$V"

  # iPhone app → App Store Connect → TestFlight, with the same version number as the Mac release.
  ios:
    needs: release
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
      RELAY_URL: ${{ vars.RELAY_URL }}
      FLY_APP: ${{ vars.FLY_APP_NAME }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::notice::iPhone app not uploaded: set APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_P8 (see docs/iOS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Archive
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          APP="${FLY_APP:-glucos-relay-$OWNER}"
          URL="${RELAY_URL:-https://$APP.fly.dev}"
          [ -n "$RELAY_SECRET" ] || URL=""
          set -o pipefail
          xcodebuild -project GlucOS.xcodeproj -scheme GlucOSiOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GlucOS.xcarchive" \
            -derivedDataPath build-ios -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ needs.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GLUCOS_RELAY_URL="$URL" GLUCOS_RELAY_SECRET="$RELAY_SECRET" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE|Signing" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { echo "::error::iOS archive failed"; grep -E "error:" archive.log | sort -u; exit 1; }

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GlucOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "Uploaded GlucOS ${{ needs.release.outputs.version }} (${{ github.run_number }}) to App Store Connect; TestFlight has it once Apple finishes processing."

  # The push relay → Fly.io. Creates the app and its volume the first time.
  relay:
    needs: gate
    if: needs.gate.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FLY_APP: ${{ vars.FLY_APP_NAME }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$RELAY_SECRET" ]; then
            echo "::notice::Push relay not deployed: set FLY_API_TOKEN and RELAY_SECRET (see docs/iOS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.check.outputs.ready == 'true'

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          APP="${FLY_APP:-glucos-relay-$OWNER}"
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP"
          flyctl volumes list -a "$APP" --json | grep -q '"glucos_data"' \
            || flyctl volumes create glucos_data -a "$APP" --region syd --size 1 --yes
          # Secrets live in GitHub; copy them over on every deploy so there's one place to change them.
          printf 'RELAY_SECRET=%s\nAPNS_KEY_ID=%s\nAPPLE_TEAM_ID=%s\n' "$RELAY_SECRET" "$APNS_KEY_ID" "$TEAM_ID" > "$RUNNER_TEMP/env"
          [ -n "$APNS_KEY_P8" ] && printf 'APNS_KEY_P8=%s\n' "$(printf '%s' "$APNS_KEY_P8" | awk '{printf "%s\\n", $0}')" >> "$RUNNER_TEMP/env"
          flyctl secrets import --stage -a "$APP" < "$RUNNER_TEMP/env"
          rm -f "$RUNNER_TEMP/env"
          [ -n "$APNS_KEY_P8" ] || echo "::notice::Relay deployed without APNS_KEY_P8: it fetches but can't push until that secret is set."
          flyctl deploy . --config Relay/fly.toml --dockerfile Relay/Dockerfile -a "$APP" --remote-only --ha=false
          echo "Relay: https://$APP.fly.dev/health"
