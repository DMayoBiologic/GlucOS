# The live web view behind GlucOS share links (web/share), on GitHub Pages:
# https://dmayobiologic.github.io/GlucOS/share/#<token>. Deployed from main whenever web/ changes.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions". Until then this workflow skips with
# a notice instead of failing (GITHUB_TOKEN can't turn Pages on by itself).
name: Share web view

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages is on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't set to deploy from Actions yet. Settings → Pages → Source: GitHub Actions, then re-run this workflow. Share links still work in the GlucOS app meanwhile."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
